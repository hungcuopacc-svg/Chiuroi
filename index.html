*{margin:0;padding:0;box-sizing:border-box;}
body{background:linear-gradient(135deg,#fff0f3 0%,#ffe0eb 50%,#ffd6e7 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Nunito',sans-serif;overflow:hidden;position:relative;}
.bg-hearts{position:fixed;inset:0;pointer-events:none;z-index:0;}
.bh{position:absolute;opacity:.13;animation:floatUp linear infinite;}
@keyframes floatUp{0%{transform:translateY(110vh) rotate(0deg);opacity:.13;}100%{transform:translateY(-10vh) rotate(720deg);opacity:0;}}
#screen1,#screen2{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:16px;}
#screen2{display:none;}
canvas{cursor:grab;}canvas:active{cursor:grabbing;}
.card{background:rgba(255,255,255,.75);backdrop-filter:blur(24px);border-radius:40px;padding:32px 40px;box-shadow:0 24px 60px rgba(255,143,171,.28),0 0 0 1.5px rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;gap:18px;min-width:320px;}
.bubble{position:relative;background:#fff;border:2.5px solid #ffb3c6;border-radius:20px;padding:12px 18px;font-size:15px;font-weight:800;color:#c9184a;text-align:center;min-height:48px;min-width:230px;max-width:270px;line-height:1.5;}
.bubble::after{content:'';position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#ffb3c6;}
.bubble::before{content:'';position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff;z-index:1;}
.bubble.pop{animation:bubblePop .3s cubic-bezier(.175,.885,.32,1.275);}
@keyframes bubblePop{0%{opacity:0;transform:scale(.7);}100%{opacity:1;transform:scale(1);}}
.btn-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;width:270px;height:128px;}
.btn{padding:14px 50px;border-radius:50px;border:none;font-size:19px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;position:absolute;box-shadow:0 8px 24px rgba(255,143,171,.35);letter-spacing:.5px;white-space:nowrap;}
#btn-hong{background:#fff;color:#ff8fab;border:2.5px solid #ffb3c6;top:0;left:50%;transform:translateX(-50%);}
#btn-da{background:linear-gradient(135deg,#ff8fab,#c9184a);color:#fff;top:66px;left:50%;transform:translateX(-50%);transition:transform .15s,box-shadow .15s;}
#btn-da:hover{transform:translateX(-50%) scale(1.08);box-shadow:0 12px 32px rgba(201,24,74,.4);}
.love-text{font-size:30px;font-weight:900;color:#c9184a;text-align:center;animation:popIn .6s cubic-bezier(.175,.885,.32,1.275) both;}
.sub-text{font-size:16px;color:#ff8fab;font-weight:700;animation:popIn .6s .3s cubic-bezier(.175,.885,.32,1.275) both;}
@keyframes popIn{0%{opacity:0;transform:scale(.5) translateY(20px);}100%{opacity:1;transform:scale(1) translateY(0);}}
.heart-fall{position:fixed;pointer-events:none;z-index:5;animation:hfall linear forwards;}
@keyframes hfall{0%{transform:translateY(-60px) rotate(0deg) scale(0);opacity:1;}8%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(110vh) rotate(540deg) scale(.5);opacity:0;}}
</style>

// ===== CAT 3D =====
const moodCfg={
  normal:{ eyeType:'normal',mouth:'none', earTilt:.25,bodyColor:0xf5e6d3},
  sad:   { eyeType:'sad',   mouth:'sad',  earTilt:.18,bodyColor:0xf0ddd0},
  beg:   { eyeType:'beg',   mouth:'none', earTilt:.30,bodyColor:0xf5e6d3},
  angry: { eyeType:'angry', mouth:'flat', earTilt:.40,bodyColor:0xffe0e0},
  cry:   { eyeType:'cry',   mouth:'sad',  earTilt:.15,bodyColor:0xeedddd},
  sulk:  { eyeType:'sulk',  mouth:'flat', earTilt:.35,bodyColor:0xffdde0},
  shock: { eyeType:'shock', mouth:'open', earTilt:.20,bodyColor:0xf5e6d3},
  happy: { eyeType:'happy', mouth:'smile',earTilt:.25,bodyColor:0xfff0f0},
};

function buildCat(canvasId,moodKey){
  const canvas=document.getElementById(canvasId);
  const R=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  R.setPixelRatio(window.devicePixelRatio);R.setSize(240,240);
  const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,100);
  cam.position.set(0,.3,4.8);
  scene.add(new THREE.AmbientLight(0xffffff,.85));
  const dl=new THREE.DirectionalLight(0xfff0f3,1.2);dl.position.set(3,5,5);scene.add(dl);
  const pl=new THREE.PointLight(0xff8fab,1.6,12);pl.position.set(-2,2,3);scene.add(pl);
  const mood=moodCfg[moodKey]||moodCfg.normal;
  const fur=new THREE.MeshStandardMaterial({color:mood.bodyColor,roughness:.6,metalness:.05});
  const pinkM=new THREE.MeshStandardMaterial({color:0xffb3c6,roughness:.5});
  const blk=new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:.4});
  const wht=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3});
  const noseM=new THREE.MeshStandardMaterial({color:0xff7096,roughness:.4});
  const tearM=new THREE.MeshStandardMaterial({color:0x99ccff,roughness:.3,transparent:true,opacity:.8});
  const g=new THREE.Group();scene.add(g);
  // Body
  const bod=new THREE.Mesh(new THREE.SphereGeometry(.82,32,32),fur);bod.scale.set(1,1.08,.88);bod.position.y=-.48;g.add(bod);
  // Head
  const hd=new THREE.Mesh(new THREE.SphereGeometry(.70,32,32),fur);hd.position.y=.62;g.add(hd);
  // Cheeks
  const cSz=(moodKey==='beg'||moodKey==='cry')?.24:.20,cOp=(moodKey==='beg'||moodKey==='cry')?.85:.65;
  [-1,1].forEach(s=>{const c=new THREE.Mesh(new THREE.SphereGeometry(cSz,16,16),new THREE.MeshStandardMaterial({color:0xffb3c6,roughness:.5,transparent:true,opacity:cOp}));c.scale.set(1,.55,.45);c.position.set(s*.41,.54,.64);g.add(c);});
  // Ears
  [-1,1].forEach(s=>{const bk=moodKey==='angry'||moodKey==='sulk',eY=bk?1.22:1.28,eZ=bk?-.1:.08;
    const e=new THREE.Mesh(new THREE.ConeGeometry(.20,.34,3),fur);e.position.set(s*.46,eY,eZ);e.rotation.z=-s*mood.earTilt;if(bk)e.rotation.x=.3;g.add(e);
    const ie=new THREE.Mesh(new THREE.ConeGeometry(.10,.20,3),pinkM);ie.position.set(s*.46,eY,eZ+.06);ie.rotation.z=-s*mood.earTilt;if(bk)ie.rotation.x=.3;g.add(ie);});
  // Eyes
  const ey=.72,ez=.68;
  const et=mood.eyeType;
  if(et==='normal'){[-1,1].forEach(s=>{const eye=new THREE.Mesh(new THREE.SphereGeometry(.088,16,16),blk);eye.position.set(s*.24,ey,ez);g.add(eye);const sh=new THREE.Mesh(new THREE.SphereGeometry(.028,8,8),wht);sh.position.set(s*.24+.028,ey+.03,.75);g.add(sh);});}
  else if(et==='happy'){[-1,1].forEach(s=>{const arc=new THREE.Mesh(new THREE.TorusGeometry(.10,.026,8,24,Math.PI),blk);arc.position.set(s*.24,ey,ez);arc.rotation.z=s>0?0:Math.PI;g.add(arc);});}
  else if(et==='sad'){[-1,1].forEach(s=>{const arc=new THREE.Mesh(new THREE.TorusGeometry(.088,.024,8,20,Math.PI),blk);arc.position.set(s*.24,ey-.02,ez);arc.rotation.z=s>0?Math.PI:0;g.add(arc);});}
  else if(et==='cry'){[-1,1].forEach(s=>{const arc=new THREE.Mesh(new THREE.TorusGeometry(.088,.024,8,20,Math.PI),blk);arc.position.set(s*.24,ey-.02,ez);arc.rotation.z=s>0?Math.PI:0;g.add(arc);const td=new THREE.Mesh(new THREE.SphereGeometry(.04,8,8),tearM);td.scale.set(1,1.6,1);td.position.set(s*.24,ey-.18,ez);g.add(td);const td2=new THREE.Mesh(new THREE.SphereGeometry(.03,8,8),tearM);td2.scale.set(1,1.4,1);td2.position.set(s*.24-.02,ey-.3,ez);g.add(td2);});}
  else if(et==='angry'){[-1,1].forEach(s=>{const eye=new THREE.Mesh(new THREE.SphereGeometry(.088,16,16),blk);eye.position.set(s*.24,ey,ez);g.add(eye);const brow=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.22,8),blk);brow.rotation.z=s*.5;brow.position.set(s*.24,ey+.16,ez+.02);g.add(brow);});}
  else if(et==='sulk'){[-1,1].forEach(s=>{const eye=new THREE.Mesh(new THREE.SphereGeometry(.08,16,16),blk);eye.position.set(s*.24,ey,ez);g.add(eye);const brow=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.2,8),blk);brow.rotation.z=s*.35;brow.position.set(s*.22,ey+.14,ez+.02);g.add(brow);});}
  else if(et==='shock'){[-1,1].forEach(s=>{const eye=new THREE.Mesh(new THREE.SphereGeometry(.115,16,16),blk);eye.position.set(s*.26,ey,ez);g.add(eye);const sh=new THREE.Mesh(new THREE.SphereGeometry(.04,8,8),wht);sh.position.set(s*.26+.04,ey+.04,.76);g.add(sh);});}
  else if(et==='beg'){[-1,1].forEach(s=>{const eye=new THREE.Mesh(new THREE.SphereGeometry(.11,16,16),blk);eye.position.set(s*.25,ey,ez);g.add(eye);const sh=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),wht);sh.position.set(s*.25+.04,ey+.05,.77);g.add(sh);const sh2=new THREE.Mesh(new THREE.SphereGeometry(.025,8,8),wht);sh2.position.set(s*.25-.03,ey-.02,.77);g.add(sh2);});}
  // Nose
  const n=new THREE.Mesh(new THREE.SphereGeometry(.046,8,8),noseM);n.scale.set(1.2,.8,.8);n.position.set(0,.60,.72);g.add(n);
  // Mouth
  if(mood.mouth==='smile'){[-1,1].forEach(s=>{const sm=new THREE.Mesh(new THREE.TorusGeometry(.082,.021,8,16,Math.PI*.65),noseM);sm.position.set(s*.068,.50,.71);sm.rotation.z=s*.55;g.add(sm);});}
  else if(mood.mouth==='sad'){[-1,1].forEach(s=>{const sm=new THREE.Mesh(new THREE.TorusGeometry(.075,.020,8,16,Math.PI*.6),noseM);sm.position.set(s*.06,.48,.71);sm.rotation.z=-s*.5;g.add(sm);});}
  else if(mood.mouth==='flat'){const fl=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.22,8),noseM);fl.rotation.z=Math.PI/2;fl.position.set(0,.50,.72);g.add(fl);}
  else if(mood.mouth==='open'){const o=new THREE.Mesh(new THREE.SphereGeometry(.08,12,12),new THREE.MeshStandardMaterial({color:0xff4466,roughness:.5}));o.scale.set(1,.7,1);o.position.set(0,.5,.73);g.add(o);}
  // Whiskers
  [-1,1].forEach(s=>{for(let i=-1;i<=1;i++){const w=new THREE.Mesh(new THREE.CylinderGeometry(.009,.004,.46,4),new THREE.MeshStandardMaterial({color:0x999999,roughness:.9}));w.rotation.z=Math.PI/2;w.position.set(s*.50,.59+i*.052,.57);g.add(w);}});
  // Tail
  const tc=new THREE.QuadraticBezierCurve3(new THREE.Vector3(.62,-1.1,0),new THREE.Vector3(1.3,-.4,.28),new THREE.Vector3(1.0,.08,0));
  g.add(new THREE.Mesh(new THREE.TubeGeometry(tc,20,.088,8,false),fur));
  // Paws
  [-1,1].forEach(s=>{const p=new THREE.Mesh(new THREE.SphereGeometry(.18,16,16),fur);p.scale.set(1.2,.65,1);p.position.set(s*.36,-1.2,.26);g.add(p);if(moodKey==='beg'){const pb=new THREE.Mesh(new THREE.SphereGeometry(.15,16,16),fur);pb.scale.set(1,.65,1);pb.position.set(s*.4,-.4,.55);g.add(pb);}});
  // Hearts
  let hearts=[];
  if(moodKey==='happy'){
    const hs=new THREE.Shape();hs.moveTo(0,0);hs.bezierCurveTo(0,-.1,-.2,-.25,-.3,-.2);hs.bezierCurveTo(-.5,-.1,-.5,.15,-.5,.15);hs.bezierCurveTo(-.5,.4,-.25,.55,0,.6);hs.bezierCurveTo(.25,.55,.5,.4,.5,.15);hs.bezierCurveTo(.5,.15,.5,-.1,.3,-.2);hs.bezierCurveTo(.2,-.25,0,-.1,0,0);
    [[.5,1.42,.28,.44,0xff4d6d],[-.45,1.52,.18,.28,0xff8fab],[.15,1.7,.1,.2,0xffb3c6]].forEach(([x,y,z,sc,col])=>{const hm=new THREE.Mesh(new THREE.ShapeGeometry(hs),new THREE.MeshStandardMaterial({color:col,side:THREE.DoubleSide}));hm.position.set(x,y,z);hm.scale.setScalar(sc);scene.add(hm);hearts.push(hm);});
  }
  // Drag
  let ry=0,rx=0,drag=false,lx=0,ly=0;
  canvas.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
  window.addEventListener('mouseup',()=>drag=false);
  window.addEventListener('mousemove',e=>{if(!drag)return;ry+=(e.clientX-lx)*.013;rx+=(e.clientY-ly)*.013;lx=e.clientX;ly=e.clientY;});
  canvas.addEventListener('touchstart',e=>{drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;},{passive:true});
  canvas.addEventListener('touchend',()=>drag=false);
  canvas.addEventListener('touchmove',e=>{e.preventDefault();ry+=(e.touches[0].clientX-lx)*.015;rx+=(e.touches[0].clientY-ly)*.015;lx=e.touches[0].clientX;ly=e.touches[0].clientY;},{passive:false});
  let t=0,running=true;
  (function loop(){if(!running)return;requestAnimationFrame(loop);t+=.022;
    if(drag){g.rotation.y=ry;g.rotation.x=Math.max(-.6,Math.min(.6,rx));}
    else{g.rotation.y+=(ry-g.rotation.y)*.07;ry*=.96;g.rotation.y+=Math.sin(t*.45)*.003;}
    g.position.y=Math.sin(t)*(moodKey==='cry'?.04:moodKey==='angry'?.12:.09);
    if(moodKey==='angry')g.position.x=Math.sin(t*4)*.06;
    hearts.forEach((hm,i)=>{hm.position.y=[1.42,1.52,1.7][i]+Math.sin(t*1.3+i)*.13;hm.rotation.z=Math.sin(t*.9+i)*.18;hm.scale.setScalar([.44,.28,.2][i]+Math.abs(Math.sin(t*1.1+i))*.08);});
    R.render(scene,cam);
  })();
  return ()=>{running=false;R.dispose();};
}

let stopCat=buildCat('c1','normal');
let hongCount=0,busy=false;
const bubble=document.getElementById('bubble');
const btnH=document.getElementById('btn-hong');

function nextHong(cx,cy){
  if(busy)return;busy=true;
  let row;
  if(hongCount<hongScript.length) row=hongScript[hongCount];
  else row=loopLines[Math.floor(Math.random()*loopLines.length)];
  const[mk,bt,bnT]=row;
  if(stopCat)stopCat();
  stopCat=buildCat('c1',mk);
  bubble.textContent=bt;bubble.classList.remove('pop');void bubble.offsetWidth;bubble.classList.add('pop');
  btnH.textContent=bnT;
  const bw=btnH.offsetWidth,bh=btnH.offsetHeight,W=window.innerWidth,H=window.innerHeight;
  let nx,ny,tries=0;
  do{nx=Math.random()*(W-bw-24)+12;ny=Math.random()*(H-bh-24)+12;tries++;}
  while(Math.hypot(nx-(cx||W/2),ny-(cy||H/2))<110&&tries<30);
  btnH.style.position='fixed';btnH.style.left=nx+'px';btnH.style.top=ny+'px';btnH.style.transform='none';
  hongCount++;setTimeout(()=>{busy=false;},220);
}

btnH.addEventListener('mouseover',e=>nextHong(e.clientX,e.clientY));
btnH.addEventListener('click',e=>nextHong(e.clientX,e.clientY));
btnH.addEventListener('touchstart',e=>{e.preventDefault();nextHong(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});

function showLove(){
  document.getElementById('screen1').style.display='none';
  if(stopCat)stopCat();
  document.getElementById('screen2').style.display='flex';
  buildCat('c2','happy');
  const em2=['💕','💗','💓','🩷','💝','💖','❤️','💞','🌸','✨'];
  function drop(){const h=document.createElement('div');h.className='heart-fall';h.textContent=em2[Math.floor(Math.random()*em2.length)];h.style.left=Math.random()*100+'vw';h.style.top='-40px';h.style.fontSize=(14+Math.random()*22)+'px';const d=3+Math.random()*4;h.style.animationDuration=d+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),d*1000+300);}
  for(let i=0;i<18;i++)setTimeout(drop,i*80);setInterval(drop,300);
}
